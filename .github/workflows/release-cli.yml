name: Release CLI

on:
  push:
    branches:
      - extra-docs

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Set version
        id: version
        run: |
          VERSION="0.0.0-extra-docs-$(date -u +%Y%m%d%H%M)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Automated build from extra-docs branch ($(date -u +%Y-%m-%d))" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build CLI
        working-directory: packages/opencode
        run: bun run build --single
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload release assets
        working-directory: packages/opencode
        run: |
          for dir in dist/opencode-linux-*/bin; do
            name=$(basename "$(dirname "$dir")")
            tar -czf "dist/${name}.tar.gz" -C "$dir" .
          done
          gh release upload "v${{ steps.version.outputs.version }}" dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
